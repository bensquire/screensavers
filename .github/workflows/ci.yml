name: CI

# Lint and test once for the whole package, then build and load each saver in
# parallel. Tagged releases are handled by release.yml — skip this on tags to
# avoid wasted CI minutes.

on:
  push:
    branches: [main]
    tags-ignore: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Lint
        run: make lint
      # Release-mode: the three-body tests are numerical — million-step
      # integrations and convergence-slope measurements — and unoptimised they
      # take tens of minutes.
      - name: Test
        run: make test

  savers:
    name: Build ${{ matrix.saver }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Kept in step with savers/ by the "every saver is covered" check below,
        # so adding a screensaver cannot silently go untested.
        saver: [solar-system, three-body]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Every saver is covered by this matrix
        run: |
          for dir in savers/*/; do
            name=$(basename "$dir")
            grep -q "\b$name\b" .github/workflows/ci.yml \
              || { echo "::error::savers/$name is not in the CI matrix"; exit 1; }
          done

      - name: Build (ad-hoc signed)
        run: make build SAVER=${{ matrix.saver }}

      - name: Verify bundle layout, architectures, and signature
        run: |
          source savers/${{ matrix.saver }}/saver.conf
          SAVER="build/${{ matrix.saver }}/$BUNDLE_NAME.saver"
          test -f "$SAVER/Contents/MacOS/$EXECUTABLE"
          test -f "$SAVER/Contents/Info.plist"
          # System Settings shows a blank tile without these, which is easy to miss.
          test -f "$SAVER/Contents/Resources/thumbnail.png"
          test -f "$SAVER/Contents/Resources/thumbnail@2x.png"
          # Both slices must be present or Intel Macs silently fail to load it.
          lipo -archs "$SAVER/Contents/MacOS/$EXECUTABLE" | tee /dev/stderr | grep -q "arm64"
          lipo -archs "$SAVER/Contents/MacOS/$EXECUTABLE" | grep -q "x86_64"
          codesign --verify --strict --verbose=2 "$SAVER"

      - name: Load, animate and draw
        run: make verify SAVER=${{ matrix.saver }}

      - name: Upload rendered frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-${{ matrix.saver }}
          path: build/${{ matrix.saver }}/check.png
          if-no-files-found: ignore
          retention-days: 7
