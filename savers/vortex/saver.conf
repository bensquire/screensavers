BUNDLE_NAME="Sliders Vortex"
EXECUTABLE="VortexSaver"
MODULES="SaverKit VortexCore VortexRender VortexSaver"
FRAMEWORKS="ScreenSaver Metal QuartzCore AppKit"
DEPLOYMENT_TARGET="14.0"
C_SOURCES=""
C_INCLUDE=""
APP_PRODUCT="VortexApp"
EXTRA_RESOURCES=""
ZIP_PREFIX="SlidersVortex"
# Shaders. Compiled to Contents/Resources/<METAL_LIBRARY>.metallib, which
# ShaderLibrary looks for by name.
METAL_SOURCES="Sources/VortexRender/Vortex.metal"
METAL_LIBRARY="Vortex"
# The scene is drawn by the GPU into a CAMetalLayer, so cacheDisplay captures an
# empty view — the same reason solar-system opts out. What a frame actually
# contains is asserted in VortexTests instead, which renders offscreen and reads
# the pixels back.
VERIFY_RENDER="none"
