BUNDLE_NAME="Gargantua"
EXECUTABLE="GargantuaSaver"
MODULES="SaverKit GargantuaCore GargantuaRender GargantuaSaver"
FRAMEWORKS="ScreenSaver Metal QuartzCore AppKit"
DEPLOYMENT_TARGET="14.0"
C_SOURCES=""
C_INCLUDE=""
APP_PRODUCT="GargantuaApp"
EXTRA_RESOURCES=""
ZIP_PREFIX="Gargantua"
# Shaders. Compiled to Contents/Resources/<METAL_LIBRARY>.metallib, which
# ShaderLibrary looks for by name.
METAL_SOURCES="Sources/GargantuaRender/Gargantua.metal"
METAL_LIBRARY="Gargantua"
# The scene is drawn by the GPU into a CAMetalLayer, so cacheDisplay captures an
# empty view. What a frame actually contains is asserted in GargantuaTests
# instead, which renders offscreen and reads the pixels back.
VERIFY_RENDER="none"
